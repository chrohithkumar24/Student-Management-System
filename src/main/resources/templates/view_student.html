<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
>
<head>
    <meta charset="UTF-8">
    <title>Student Management System </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Student Management System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/students/new}" >New Student</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/students}" > Students</a>
                </li>
            </ul>

        </div>
    </div>
</nav>
<br /> <br />
<div class="container">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card-header">
                <h2 class="text-center"> Student Details</h2>

            </div>
            <div class="card-body">
                <p>student First Name: <Strong th:text="${student.firstname}"></Strong> </p>
                <p>student Last Name: <Strong th:text="${student.lastname}"></Strong> </p>
                <p>student Email Address: <Strong th:text="${student.email}"></Strong> </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
